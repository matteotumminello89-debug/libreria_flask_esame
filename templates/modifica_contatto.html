{% extends "base.html" %}

{% block title %}Modifica contatto{% endblock %}

{% block content %}
    <h1>Modifica contatto</h1>

    <form method="post">
        <label for="nome">Nome</label><br>
        <input type="text" id="nome" name="nome" value="{{ utente.nome }}" required><br>

        <label for="cognome">Cognome</label><br>
        <input type="text" id="cognome" name="cognome" value="{{ utente.cognome }}" required><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" value="{{ utente.email }}"><br>

        <label for="telefono">Telefono</label><br>
        <input type="text" id="telefono" name="telefono" value="{{ utente.telefono }}"><br>

        <label for="indirizzo">Indirizzo</label><br>
        <input type="text" id="indirizzo" name="indirizzo" value="{{ utente.indirizzo }}"><br>

        <label for="citta">Città</label><br>
        <input type="text" id="citta" name="citta" value="{{ utente.citta }}"><br>

        <label for="cap">CAP</label><br>
        <input type="text" id="cap" name="cap" value="{{ utente.cap }}"><br>

        <button type="submit">Salva modifiche</button>
    </form>

    <p><a href="{{ url_for('gestione_contatti') }}">← Torna all'elenco contatti</a></p>
{% endblock %}
