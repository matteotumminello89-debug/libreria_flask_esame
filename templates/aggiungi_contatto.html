{% extends "base.html" %}

{% block title %}Aggiungi contatto{% endblock %}

{% block content %}
    <h1>Aggiungi un nuovo contatto</h1>

    <form method="post">
        <label for="nome">Nome</label><br>
        <input type="text" id="nome" name="nome" required><br>

        <label for="cognome">Cognome</label><br>
        <input type="text" id="cognome" name="cognome" required><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" name="email"><br>

        <label for="telefono">Telefono</label><br>
        <input type="text" id="telefono" name="telefono"><br>

        <label for="indirizzo">Indirizzo</label><br>
        <input type="text" id="indirizzo" name="indirizzo"><br>

        <label for="citta">Città</label><br>
        <input type="text" id="citta" name="citta"><br>

        <label for="cap">CAP</label><br>
        <input type="text" id="cap" name="cap"><br>

        <button type="submit">Salva</button>
    </form>

    <p><a href="{{ url_for('gestione_contatti') }}">← Torna all'elenco contatti</a></p>
{% endblock %}
